name: Build VM Templates

on:
  schedule:
    - cron: '0 6 * * 0' # Weekly on Sunday at 6 AM UTC
  push:
    paths:
      - 'packer/**'
  workflow_dispatch:

jobs:
  build-template:
    name: Build ${{ matrix.name }}
    runs-on: self-hosted # Requires vCenter access
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            path: linux/ubuntu-2404
          - name: RHEL 9
            path: linux/rhel-9
          - name: Rocky Linux 9
            path: linux/rocky-9
          - name: Windows Server 2022
            path: windows/windows-server-2022
          - name: Windows Server 2025
            path: windows/windows-server-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Init Packer
        run: packer init packer/builds/${{ matrix.path }}/

      - name: Validate
        run: |
          packer validate \
            -var-file="packer/config/vsphere.pkrvars.hcl" \
            -var-file="packer/config/common.pkrvars.hcl" \
            packer/builds/${{ matrix.path }}/

      - name: Build
        run: |
          packer build -force \
            -var-file="packer/config/vsphere.pkrvars.hcl" \
            -var-file="packer/config/common.pkrvars.hcl" \
            packer/builds/${{ matrix.path }}/
        env:
          VSPHERE_PASSWORD: ${{ secrets.VSPHERE_PASSWORD }}
