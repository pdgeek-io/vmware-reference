---
# Shared CIS-aligned Linux template baseline for Packer builds.
#
# Scope:
# - Runs while building golden VM templates.
# - Applies low-risk controls expected on every Linux VM.
# - Leaves workload-specific controls to post-clone Ansible playbooks.
#
# This is not a full certification artifact by itself. It is the baseline entry
# point where CIS benchmark controls are applied and evidenced before Terraform
# can deploy a catalog VM from the template.
- name: Apply CIS-aligned Linux template baseline
  hosts: all
  become: true
  gather_facts: true

  vars:
    cis_template_baseline_version: "2026.08.18"
    cis_login_defs:
      PASS_MAX_DAYS: "90"
      PASS_MIN_DAYS: "1"
      PASS_WARN_AGE: "7"
    cis_sysctl_settings:
      net.ipv4.ip_forward: "0"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
      net.ipv4.conf.all.secure_redirects: "0"
      net.ipv4.conf.default.secure_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
      net.ipv4.conf.all.accept_source_route: "0"
      net.ipv4.conf.default.accept_source_route: "0"
      net.ipv4.conf.all.log_martians: "1"
      net.ipv4.conf.default.log_martians: "1"
      kernel.randomize_va_space: "2"

  handlers:
    - name: restart ssh
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: restarted

    - name: reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

  tasks:
    - name: Install baseline security packages on Debian family
      ansible.builtin.package:
        name:
          - auditd
          - audispd-plugins
          - ca-certificates
          - chrony
          - libpam-pwquality
          - openssh-server
          - sudo
          - ufw
        state: present
      when: ansible_os_family == "Debian"

    - name: Install baseline security packages on RedHat family
      ansible.builtin.package:
        name:
          - audit
          - audit-libs
          - ca-certificates
          - chrony
          - libpwquality
          - openssh-server
          - sudo
        state: present
      when: ansible_os_family == "RedHat"

    - name: Enable audit daemon
      ansible.builtin.service:
        name: auditd
        state: started
        enabled: true

    - name: Enable chrony
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true
      when: ansible_os_family == "RedHat"

    - name: Enable chrony on Debian family
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
      when: ansible_os_family == "Debian"

    - name: Configure password aging defaults
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: "^{{ item.key }}\\s+"
        line: "{{ item.key }}\t{{ item.value }}"
        create: false
        mode: "0644"
      loop: "{{ cis_login_defs | dict2items }}"

    - name: Configure secure default umask
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: "^UMASK\\s+"
        line: "UMASK\t027"
        create: false
        mode: "0644"

    - name: Harden SSH server defaults
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }}\\s+"
        line: "{{ item.key }} {{ item.value }}"
        validate: "sshd -t -f %s"
        mode: "0600"
      loop:
        - { key: "PermitRootLogin", value: "no" }
        - { key: "PasswordAuthentication", value: "no" }
        - { key: "PermitEmptyPasswords", value: "no" }
        - { key: "X11Forwarding", value: "no" }
        - { key: "MaxAuthTries", value: "4" }
        - { key: "ClientAliveInterval", value: "300" }
        - { key: "ClientAliveCountMax", value: "0" }
      notify: restart ssh

    - name: Disable core dumps through limits
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-cis-core-dumps.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          * hard core 0

    - name: Disable suid core dumps
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-cis-template.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          fs.suid_dumpable = 0
          {% for key, value in cis_sysctl_settings.items() %}
          {{ key }} = {{ value }}
          {% endfor %}
      notify: reload sysctl

    - name: Enable uncomplicated firewall on Debian templates
      community.general.ufw:
        rule: allow
        name: OpenSSH
      when: ansible_os_family == "Debian"

    - name: Enable ufw default deny incoming on Debian templates
      community.general.ufw:
        direction: incoming
        policy: deny
      when: ansible_os_family == "Debian"

    - name: Enable ufw on Debian templates
      community.general.ufw:
        state: enabled
      when: ansible_os_family == "Debian"

    - name: Create template baseline evidence directory
      ansible.builtin.file:
        path: /etc/pdgeek
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write CIS template baseline evidence
      ansible.builtin.copy:
        dest: /etc/pdgeek/cis-template-baseline.yml
        owner: root
        group: root
        mode: "0644"
        content: |
          baseline: cis-aligned-linux-template
          version: {{ cis_template_baseline_version }}
          os_family: {{ ansible_os_family }}
          distribution: {{ ansible_distribution }}
          distribution_version: {{ ansible_distribution_version }}
          applied_by: packer
          managed_by: VMware Automation
