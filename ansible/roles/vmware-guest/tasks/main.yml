---
- name: Ensure open-vm-tools is installed
  ansible.builtin.package:
    name: open-vm-tools
    state: present
  when: vmware_guest_manage_packages | default(true) | bool

- name: Enable and start vmtoolsd
  ansible.builtin.service:
    name: vmtoolsd
    state: started
    enabled: true

- name: Verify VMware Tools version
  ansible.builtin.command: vmware-toolbox-cmd -v
  register: vmtools_version
  changed_when: false

- name: Display VMware Tools version
  ansible.builtin.debug:
    msg: "VMware Tools version: {{ vmtools_version.stdout }}"

# Disk reclaim — fstrim sends SCSI UNMAP through pvscsi so PowerStore
# can reclaim deleted blocks from thin-provisioned VMDKs.
- name: Enable fstrim.timer for disk space reclaim
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started

- name: Enable LVM issue_discards for TRIM passthrough
  ansible.builtin.lineinfile:
    path: /etc/lvm/lvm.conf
    regexp: '^\s*issue_discards\s*='
    line: '  issue_discards = 1'
    backrefs: true
  when: ansible_facts.os_family in ["RedHat", "Debian"]
