---
# Initialize raw PowerStore volumes for SQL Server
# Each volume lands as a raw disk — initialize, partition, format with 64K allocation unit

- name: Initialize SQL data disk (D:)
  ansible.windows.win_powershell:
    script: |
      $disk = Get-Disk | Where-Object { $_.PartitionStyle -eq 'RAW' -and [math]::Round($_.Size / 1GB) -eq {{ mssql_data_disk_size_gb }} } | Select-Object -First 1
      if ($disk) {
        $disk | Initialize-Disk -PartitionStyle GPT -PassThru |
          New-Partition -DriveLetter D -UseMaximumSize |
          Format-Volume -FileSystem NTFS -AllocationUnitSize {{ mssql_allocation_unit_size }} -NewFileSystemLabel "SQLData" -Confirm:$false
      }
    creates: D:\

