---
# SQL Server backup automation via SQL Agent jobs
# Full backup daily + transaction log backups every N minutes
# No AD required — uses sa (renamed to sqladmin) auth

- name: Set sqlcmd connection variable
  ansible.builtin.set_fact:
    _mssql_sqlcmd: >-
      sqlcmd -S "{{ (mssql_instance_name == 'MSSQLSERVER') | ternary('localhost', 'localhost\\' + mssql_instance_name) }}" -U sqladmin -P "{{ mssql_sa_password }}"

# --- Full Backup Job ---
- name: Create daily full backup job
  ansible.windows.win_powershell:
    script: |
      $conn = "{{ _mssql_sqlcmd }}"
      $backupPath = "{{ mssql_backup_path }}"
      $retentionDays = {{ mssql_backup_retention_days }}

      $sql = @"
      -- Create or replace the full backup job
      IF EXISTS (SELECT 1 FROM msdb.dbo.sysjobs WHERE name = 'DailyFullBackup')
        EXEC msdb.dbo.sp_delete_job @job_name = 'DailyFullBackup', @delete_unused_schedule = 1;

      EXEC msdb.dbo.sp_add_job
        @job_name = 'DailyFullBackup',
        @description = 'Full backup of all user databases',
        @owner_login_name = 'sqladmin',
        @enabled = 1;

      EXEC msdb.dbo.sp_add_jobstep
        @job_name = 'DailyFullBackup',
        @step_name = 'BackupAllDBs',
        @subsystem = 'TSQL',
        @command = '
          DECLARE @name NVARCHAR(256)
          DECLARE @path NVARCHAR(512)
          DECLARE @stamp NVARCHAR(20)
          SET @stamp = CONVERT(NVARCHAR(20), GETDATE(), 112) + ''_'' + REPLACE(CONVERT(NVARCHAR(8), GETDATE(), 108), '':'', '''')
          DECLARE db_cursor CURSOR FOR
            SELECT name FROM sys.databases WHERE state = 0 AND name NOT IN (''tempdb'')
          OPEN db_cursor
          FETCH NEXT FROM db_cursor INTO @name
          WHILE @@FETCH_STATUS = 0
          BEGIN
            SET @path = ''$backupPath\'' + @name + ''_FULL_'' + @stamp + ''.bak''
            BACKUP DATABASE @name TO DISK = @path WITH COMPRESSION, CHECKSUM, INIT
            FETCH NEXT FROM db_cursor INTO @name
          END
          CLOSE db_cursor
          DEALLOCATE db_cursor
        ',
        @on_success_action = 1;

      -- Schedule: daily at 1:00 AM
      EXEC msdb.dbo.sp_add_jobschedule
        @job_name = 'DailyFullBackup',
        @name = 'DailyAt1AM',
        @freq_type = 4,
        @freq_interval = 1,
        @active_start_time = 010000;

      EXEC msdb.dbo.sp_add_jobserver @job_name = 'DailyFullBackup';
      "@

      & cmd /c "$conn -Q `"$sql`""
  no_log: true

# --- Log Backup Job ---
- name: Create transaction log backup job
  ansible.windows.win_powershell:
    script: |
      $conn = "{{ _mssql_sqlcmd }}"
      $backupPath = "{{ mssql_backup_path }}"
      $intervalMin = {{ mssql_backup_log_schedule_minutes }}

      $sql = @"
      IF EXISTS (SELECT 1 FROM msdb.dbo.sysjobs WHERE name = 'LogBackup')
        EXEC msdb.dbo.sp_delete_job @job_name = 'LogBackup', @delete_unused_schedule = 1;

      EXEC msdb.dbo.sp_add_job
        @job_name = 'LogBackup',
        @description = 'Transaction log backup of all user databases in full recovery',
        @owner_login_name = 'sqladmin',
        @enabled = 1;

      EXEC msdb.dbo.sp_add_jobstep
        @job_name = 'LogBackup',
        @step_name = 'BackupLogs',
        @subsystem = 'TSQL',
        @command = '
          DECLARE @name NVARCHAR(256)
          DECLARE @path NVARCHAR(512)
          DECLARE @stamp NVARCHAR(20)
          SET @stamp = CONVERT(NVARCHAR(20), GETDATE(), 112) + ''_'' + REPLACE(CONVERT(NVARCHAR(8), GETDATE(), 108), '':'', '''')
          DECLARE db_cursor CURSOR FOR
            SELECT name FROM sys.databases
            WHERE state = 0 AND recovery_model = 1 AND name NOT IN (''master'', ''msdb'', ''tempdb'', ''model'')
          OPEN db_cursor
          FETCH NEXT FROM db_cursor INTO @name
          WHILE @@FETCH_STATUS = 0
          BEGIN
            SET @path = ''$backupPath\'' + @name + ''_LOG_'' + @stamp + ''.trn''
            BACKUP LOG @name TO DISK = @path WITH COMPRESSION, CHECKSUM, INIT
            FETCH NEXT FROM db_cursor INTO @name
          END
          CLOSE db_cursor
          DEALLOCATE db_cursor
        ',
        @on_success_action = 1;

      -- Schedule: every N minutes
      EXEC msdb.dbo.sp_add_jobschedule
        @job_name = 'LogBackup',
        @name = 'EveryNMinutes',
        @freq_type = 4,
        @freq_interval = 1,
        @freq_subday_type = 4,
        @freq_subday_interval = $intervalMin,
        @active_start_time = 0;

      EXEC msdb.dbo.sp_add_jobserver @job_name = 'LogBackup';
      "@

      & cmd /c "$conn -Q `"$sql`""
  no_log: true

# --- Cleanup Job ---
- name: Create backup cleanup job
  ansible.windows.win_powershell:
    script: |
      $conn = "{{ _mssql_sqlcmd }}"
      $backupPath = "{{ mssql_backup_path }}"
      $retentionDays = {{ mssql_backup_retention_days }}

      $sql = @"
      IF EXISTS (SELECT 1 FROM msdb.dbo.sysjobs WHERE name = 'BackupCleanup')
        EXEC msdb.dbo.sp_delete_job @job_name = 'BackupCleanup', @delete_unused_schedule = 1;

      EXEC msdb.dbo.sp_add_job
        @job_name = 'BackupCleanup',
        @description = 'Delete backup files older than retention period',
        @owner_login_name = 'sqladmin',
        @enabled = 1;

      EXEC msdb.dbo.sp_add_jobstep
        @job_name = 'BackupCleanup',
        @step_name = 'CleanupOldBackups',
        @subsystem = 'TSQL',
        @command = '
          DECLARE @cutoff DATETIME = DATEADD(DAY, -$retentionDays, GETDATE())
          EXEC master.dbo.xp_delete_files ''$backupPath\*.bak'', @cutoff
          EXEC master.dbo.xp_delete_files ''$backupPath\*.trn'', @cutoff
        ',
        @on_success_action = 1;

      -- Schedule: daily at 2:00 AM (after full backup completes)
      EXEC msdb.dbo.sp_add_jobschedule
        @job_name = 'BackupCleanup',
        @name = 'DailyAt2AM',
        @freq_type = 4,
        @freq_interval = 1,
        @active_start_time = 020000;

      EXEC msdb.dbo.sp_add_jobserver @job_name = 'BackupCleanup';
      "@

      & cmd /c "$conn -Q `"$sql`""
  no_log: true
