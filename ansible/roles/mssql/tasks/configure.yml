---
# SQL Server best practice configuration
# All settings applied via sqlcmd — no AD required

- name: Set sqlcmd connection variable
  ansible.builtin.set_fact:
    _mssql_sqlcmd: >-
      sqlcmd -S "{{ (mssql_instance_name == 'MSSQLSERVER') | ternary('localhost', 'localhost\\' + mssql_instance_name) }}" -U sa -P "{{ mssql_sa_password }}"

# --- Memory ---
- name: Configure max server memory
  ansible.windows.win_command: >
    {{ _mssql_sqlcmd }}
    -Q "EXEC sp_configure 'show advanced options', 1; RECONFIGURE;
        EXEC sp_configure 'max server memory', {{ mssql_max_memory_mb }}; RECONFIGURE;"
  no_log: true

# --- Parallelism ---
- name: Configure MAXDOP
  ansible.windows.win_command: >
    {{ _mssql_sqlcmd }}
    -Q "EXEC sp_configure 'max degree of parallelism', {{ mssql_maxdop }}; RECONFIGURE;"
  no_log: true

- name: Configure cost threshold for parallelism
  ansible.windows.win_command: >
    {{ _mssql_sqlcmd }}
    -Q "EXEC sp_configure 'cost threshold for parallelism', {{ mssql_cost_threshold_parallelism }}; RECONFIGURE;"
  no_log: true

# --- TempDB ---
# Installer creates initial files; this ensures all files are equal size
# and adds files if tempdb_file_count > what the installer created
- name: Configure tempdb files
  ansible.windows.win_powershell:
    script: |
      $conn = "{{ _mssql_sqlcmd }}"

      # Get current tempdb data file count
      $result = & cmd /c "$conn -Q `"SELECT COUNT(*) FROM tempdb.sys.database_files WHERE type = 0`" -h -1 -W"
      $currentCount = [int]($result | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1)
      $targetCount = {{ mssql_tempdb_file_count }}
      $sizeMB = {{ mssql_tempdb_file_size_mb }}
      $growthMB = {{ mssql_tempdb_file_growth_mb }}
      $tempdbPath = "{{ mssql_tempdb_path }}"

      # Resize existing files to equal size
      for ($i = 1; $i -le $currentCount; $i++) {
        $name = if ($i -eq 1) { "tempdev" } else { "temp$($i)" }
        & cmd /c "$conn -Q `"ALTER DATABASE [tempdb] MODIFY FILE (NAME = '$name', SIZE = ${sizeMB}MB, FILEGROWTH = ${growthMB}MB)`""
      }

      # Add files if needed
      for ($i = $currentCount + 1; $i -le $targetCount; $i++) {
        $name = "temp$i"
        $file = "$tempdbPath\tempdb_data_$i.ndf"
        & cmd /c "$conn -Q `"ALTER DATABASE [tempdb] ADD FILE (NAME = '$name', FILENAME = '$file', SIZE = ${sizeMB}MB, FILEGROWTH = ${growthMB}MB)`""
      }
  no_log: true

# --- Trace Flags ---
# TF 3226: Suppress successful backup messages in error log
# TF 1118: Uniform extent allocation (pre-2016 compat, harmless on 2022)
- name: Enable recommended trace flags
  ansible.windows.win_command: >
    {{ _mssql_sqlcmd }}
    -Q "DBCC TRACEON(3226, -1); DBCC TRACEON(1118, -1);"
  no_log: true

- name: Set trace flags to persist on startup
  ansible.windows.win_powershell:
    script: |
      $regPath = "HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\{{ mssql_version_path }}.{{ mssql_instance_name }}\MSSQLServer\Parameters"
      $existing = (Get-ItemProperty -Path $regPath -ErrorAction SilentlyContinue).PSObject.Properties |
        Where-Object { $_.Name -match '^SQLArg\d+$' } | Measure-Object | Select-Object -ExpandProperty Count
      # Add trace flags if not already present
      $flags = @("-T3226", "-T1118")
      $values = (Get-ItemProperty -Path $regPath -ErrorAction SilentlyContinue).PSObject.Properties |
        Where-Object { $_.Name -match '^SQLArg\d+$' } | Select-Object -ExpandProperty Value
      $nextArg = $existing
      foreach ($flag in $flags) {
        if ($values -notcontains $flag) {
          Set-ItemProperty -Path $regPath -Name "SQLArg$nextArg" -Value $flag
          $nextArg++
        }
      }

# --- Optimize for ad hoc workloads ---
- name: Enable optimize for ad hoc workloads
  ansible.windows.win_command: >
    {{ _mssql_sqlcmd }}
    -Q "EXEC sp_configure 'optimize for ad hoc workloads', 1; RECONFIGURE;"
  no_log: true

# --- Default database settings ---
- name: Set model database to simple recovery (tempdb-like behavior for new DBs)
  ansible.windows.win_command: >
    {{ _mssql_sqlcmd }}
    -Q "ALTER DATABASE [model] SET RECOVERY SIMPLE;"
  no_log: true

# --- Rename sa login for basic hardening ---
- name: Rename sa login
  ansible.windows.win_command: >
    {{ _mssql_sqlcmd }}
    -Q "IF EXISTS (SELECT 1 FROM sys.sql_logins WHERE name = 'sa')
        ALTER LOGIN [sa] WITH NAME = [sqladmin];"
  no_log: true
