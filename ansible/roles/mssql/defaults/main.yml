---
# SQL Server edition and instance
mssql_instance_name: MSSQLSERVER
mssql_port: 1433
mssql_version: "2022"
mssql_version_path: "MSSQL16"  # MSSQL16 = SQL 2022, MSSQL15 = SQL 2019
mssql_install_path: "C:\\SQLInstall"

# Credentials — set mssql_sa_password in Ansible Vault
mssql_sa_password: "{{ vault_mssql_sa_password }}"
mssql_service_account: "NT Service\\MSSQLSERVER"
mssql_service_password: ""
mssql_sysadmin_accounts: "BUILTIN\\Administrators"

# Disk layout — each maps to a separate PowerStore volume / SCSI controller
# Ansible initializes raw disks by size match (see tasks/disks.yml)
mssql_data_path: "D:\\SQLData"
mssql_log_path: "E:\\SQLLog"
mssql_tempdb_path: "F:\\SQLTempDB"
mssql_backup_path: "G:\\SQLBackup"

mssql_data_disk_size_gb: 200
mssql_log_disk_size_gb: 50
mssql_tempdb_disk_size_gb: 50
mssql_backup_disk_size_gb: 100

# 64K allocation unit — matches SQL Server extent size for best I/O
mssql_allocation_unit_size: 65536

# Best practice configs
mssql_max_memory_mb: 24576         # Leave ~4 GB for OS on a 32 GB VM
mssql_maxdop: 4                     # Match to physical cores per NUMA node
mssql_cost_threshold_parallelism: 50
mssql_tempdb_file_count: 4          # 1 per logical core (up to 8), min 4
mssql_tempdb_file_size_mb: 1024     # Equal size per file
mssql_tempdb_file_growth_mb: 256

# Backup schedule (SQL Agent jobs)
mssql_backup_full_schedule: "daily"       # daily at 1 AM
mssql_backup_log_schedule_minutes: 15     # every 15 min
mssql_backup_retention_days: 7

# Optional application database
mssql_db_name: ""
