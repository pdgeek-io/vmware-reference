---
# Deploy SQL Server on Windows Server
#
# VM best practices applied automatically:
#   - Separate PowerStore volumes: data (D:), log (E:), tempdb (F:), backup (G:)
#   - 64K NTFS allocation units on all SQL volumes
#   - Instant file initialization + lock pages in memory
#   - MAXDOP, cost threshold, memory cap tuned for workload
#   - TempDB: multiple equal-size files on dedicated volume
#   - SQL Agent backup jobs: full daily, log every 15 min, cleanup
#   - sa renamed to sqladmin
#   - No AD required
#
# Usage:
#   ansible-playbook ansible/playbooks/app-deploy-mssql.yml \
#     -i config/inventory/hosts.yml \
#     --ask-vault-pass

- name: Deploy SQL Server
  hosts: windows_db_servers

  roles:
    - role: common-windows
    - role: mssql

  vars:
    mssql_db_name: campusdb
    mssql_max_memory_mb: 24576    # 24 GB — leaves ~8 GB for OS on 32 GB VM
    mssql_maxdop: 4               # Match to physical cores per NUMA node

  tasks:
    - name: Verify SQL Server is accepting connections
      ansible.windows.win_command: >
        sqlcmd -S localhost -U sqladmin -P "{{ mssql_sa_password }}"
        -Q "SELECT @@VERSION;"
      register: sql_version
      no_log: true

    - name: Display SQL Server version
      ansible.builtin.debug:
        msg: "{{ sql_version.stdout_lines[2] | default('SQL Server running') }}"

    - name: Verify disk layout
      ansible.windows.win_powershell:
        script: |
          Get-Volume | Where-Object { $_.DriveLetter -in @('C','D','E','F','G') } |
            Select-Object DriveLetter, FileSystemLabel, @{N='SizeGB';E={[math]::Round($_.Size/1GB)}}, AllocationUnitSize |
            Format-Table -AutoSize
      register: disk_layout

    - name: Display disk layout
      ansible.builtin.debug:
        msg: "{{ disk_layout.output }}"
